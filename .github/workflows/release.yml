name: Release

# Publishing runs from CI so a release never depends on a local npm session.
# Authentication uses npm trusted publishing: npm verifies this workflow's OIDC identity
# against the trusted publisher configured for the package, so there is no token to store
# or rotate, and no one-time password prompt. npm records build provenance automatically.
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets npm exchange this workflow's OIDC identity for publish rights.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Node 22 ships npm 10, and trusted publishing needs 11.5.1 or newer.
      - run: npm install --global npm@latest
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      # A tag that disagrees with the manifest would publish a version nobody asked for.
      - name: Verify the tag matches package.json
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          manifest="$(node -p "require('./package.json').version")"
          if [ "$tagged" != "$manifest" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $manifest." >&2
            exit 1
          fi
          echo "Publishing $manifest from $GITHUB_REF_NAME."

      - run: pnpm run check

      # `check` builds dist/, which the published files list needs.
      - name: Publish to npm
        run: npm publish --access public
